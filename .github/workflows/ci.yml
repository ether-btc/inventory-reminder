name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test deps
        run: pip install pytest
      - name: Run hermetic tests
        run: python -m pytest tests -q
      - name: Smoke — no-config run degrades cleanly
        run: |
          python scripts/system-inventory.py --write
          python scripts/system-inventory.py --check
      - name: Lint (syntax + stdlib-only via AST)
        run: |
          python -m py_compile scripts/system-inventory.py scripts/repo-inventory.py
          python - <<'EOF'
          import ast, sys
          stdlib = set(sys.stdlib_module_names)
          for f in ("scripts/system-inventory.py", "scripts/repo-inventory.py"):
              tree = ast.parse(open(f).read())
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      mods = [a.name.split(".")[0] for a in node.names]
                  elif isinstance(node, ast.ImportFrom):
                      mods = [node.module.split(".")[0]] if node.module else []
                  else:
                      continue
                  bad = [m for m in mods if m and m not in stdlib]
                  if bad:
                      sys.exit(f"NON-STDLIB IMPORT in {f}: {bad}")
          print("stdlib-only: OK")
          EOF
